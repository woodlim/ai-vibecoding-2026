<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Toss Auto Trader</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
<main>
  <header class="topbar"><div><small>TOSS AUTO TRADER</small><h1>가상매매 대시보드</h1></div><b class="badge">PAPER</b></header>
  <section class="summary">
    <article><span>가용 현금</span><strong id="cash">-</strong></article>
    <article><span>보유 종목</span><strong id="positionCount">0</strong></article>
    <article><span>주문 수</span><strong id="orderCount">0</strong></article>
    <article><span>전략</span><strong id="strategyState">중지</strong></article>
  </section>
  <section class="grid">
    <article>
      <h2>토스증권 시세 조회</h2>
      <form id="quoteLookupForm"><input id="lookupSymbol" value="" placeholder="종목코드 또는 종목명"><button type="submit">조회</button></form>
      <div id="quoteResult" class="quote-result">조회된 시세가 없습니다.</div>
    </article>
  </section>
  <section class="grid">
    <article>
      <h2>자동매매 전략 (PAPER)</h2>
      <button id="strategyButton" type="button">자동매매 시작</button>
      <button id="killButton" type="button" class="danger">자동매매 중지</button>
      <p id="strategyHelp" class="subtle">하루 첫 자동매매 시작 시 가용금액의 40%를 한도로 사용합니다.</p>
      <p id="strategyMessage" role="status" aria-live="polite"></p>
    </article>
    <article><h2>보유 포지션</h2><div id="positions">없음</div></article>
  </section>
  <article class="trade-history">
    <h2>자동매매 내역 <button id="refreshButton" type="button" class="secondary">새로고침</button></h2>
    <p class="subtle">매수·매도 내역은 5초마다 갱신됩니다. 거래금액은 체결 단가 × 체결 수량입니다.</p>
    <div id="orders" class="trade-history-table">아직 자동매매 내역이 없습니다.</div>
  </article>
  <footer>V0.1 · PAPER 모드 · 토스증권 실거래 API 미연결</footer>
</main>
<script src="/app.js"></script>
</body>
</html>
