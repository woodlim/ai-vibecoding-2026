<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Toss Auto Trader</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
<main>
  <header class="topbar"><div><small>TOSS AUTO TRADER</small><h1>가상매매 대시보드</h1></div><b class="badge">PAPER</b></header>
  <section class="summary">
    <article><span>가용 현금</span><strong id="cash">-</strong></article>
    <article><span>보유 종목</span><strong id="positionCount">0</strong></article>
    <article><span>주문 수</span><strong id="orderCount">0</strong></article>
    <article><span>전략</span><strong id="strategyState">중지</strong></article>
  </section>
  <section class="grid">
    <article>
      <h2>토스증권 시세 조회</h2>
      <form id="quoteLookupForm"><input id="lookupSymbol" value="" placeholder="종목코드 또는 종목명"><button type="submit">조회</button></form>
      <div id="quoteResult" class="quote-result">조회된 시세가 없습니다.</div>
    </article>
    <article>
      <h2>가상 주문</h2>
      <form id="orderForm"><input id="orderSymbol" value="" placeholder="종목코드"><select id="side"><option value="BUY">매수</option><option value="SELL">매도</option></select><input id="quantity" type="number" value="1" min="0.0001" step="0.0001"><button>주문 실행</button></form>
      <p id="orderMessage"></p>
    </article>
  </section>
  <section class="grid">
    <article><h2>전략</h2><button id="strategyButton">SMA 전략 실행</button> <button id="killButton" class="danger">Kill switch</button><p id="strategyMessage"></p></article>
    <article><h2>보유 포지션</h2><div id="positions">없음</div></article>
  </section>
  <article><h2>최근 주문 <button id="refreshButton" class="secondary">새로고침</button></h2><div id="orders">없음</div></article>
  <footer>V0.1 · PAPER 모드 · 토스증권 실거래 API 미연결</footer>
</main>
<script src="/app.js"></script>
</body>
</html>
